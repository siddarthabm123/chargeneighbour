name: Validate application
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/check-stations.mjs
      - run: node scripts/check-safety.mjs
      - run: node scripts/check-evidence-routes.mjs
      - run: node scripts/check-database.mjs
      - run: npm run build
      - run: node scripts/check-http.mjs
